name: Feature request
description: Propose a focused improvement to Stylus.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        **DO NOT INCLUDE SECRETS OR PRIVATE DATA.** Security vulnerabilities must use the private reporting process in `.github/SECURITY.md`.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or contributor problem should be solved?
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Who needs this and in what workflow?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Describe the desired outcome without prescribing unnecessary implementation details.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Core collaboration
        - Tasks, activity, or notifications
        - Whiteboards
        - Company Knowledge or memory
        - Plugins
        - AI infrastructure
        - Jobs or Windows worker
        - Marketing
        - Documentation or developer experience
        - Other
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and privacy implications
      description: Note tenant, authorization, data retention, external-platform, AI, or memory-boundary implications.
    validations:
      required: true
